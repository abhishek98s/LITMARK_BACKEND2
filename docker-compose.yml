version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bookmark_db
    environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: bookmark_app
    environment:
          DATABASE_URL: postgresql://${POSTGRES_USER:-bookmark_user}:${POSTGRES_PASSWORD:-bookmark_pass}@postgres:5432/${POSTGRES_DB:-bookmark_db}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: